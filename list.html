<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Alle brukere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Registrerte brukere</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Brukernavn</th>
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                <tr>
                    <td>{{ row["id"] }}</td>
                    <td>{{ row["username"] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <p class="links">
            <a href="{{ url_for('index') }}">Tilbake til login</a>
        </p>
    </div>
</body>
</html>
